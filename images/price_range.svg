<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Price range diagram">
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="40" y="40" font-size="28" font-family="Arial" fill="#0f172a">价格区间示意图</text>

  <line x1="80" y1="300" x2="720" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="250" y1="100" x2="250" y2="300" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="500" y1="100" x2="500" y2="300" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 8"/>

  <rect x="260" y="170" width="240" height="130" fill="#bfdbfe" opacity="0.85"/>
  <text x="350" y="150" text-anchor="middle" font-size="18" font-family="Arial" fill="#1d4ed8">Position 区间</text>
  <text x="280" y="340" font-size="18" font-family="Arial" fill="#334155">Lower</text>
  <text x="530" y="340" font-size="18" font-family="Arial" fill="#334155">Upper</text>
</svg>
